name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Самая частая беда при загрузке через браузер: файлы попали в подпапку
      - name: Проверить, что файлы на месте
        shell: bash
        run: |
          for f in settings.gradle.kts app/build.gradle.kts app/zubki.keystore; do
            if [ ! -f "$f" ]; then
              echo "::error::Нет файла $f. Загружай на GitHub содержимое папки проекта, а не саму папку"
              exit 1
            fi
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: 8.11.1

      # Пока тесты не блокируют сборку: APK выложится, даже если тест покраснеет
      - name: Тесты
        id: tests
        continue-on-error: true
        shell: bash
        run: gradle testDebugUnitTest --console=plain 2>&1 | tee test.log

      - name: Собрать APK
        shell: bash
        run: gradle assembleRelease --console=plain 2>&1 | tee build.log

      # Если что-то упало, причина появится на главной странице запуска (блок Summary)
      # и в списке Annotations, лезть в длинный лог не нужно
      - name: Показать причину ошибки
        if: failure() || steps.tests.outcome == 'failure'
        shell: bash
        run: |
          found=0
          {
            echo "## Почему не собралось"
            for log in build.log test.log; do
              [ -f "$log" ] || continue
              errors=$(grep -E -A6 "^e: |What went wrong|FAILED" "$log" | head -60 || true)
              [ -n "$errors" ] || continue
              found=1
              echo "**$log**"
              echo '```'
              echo "$errors"
              echo '```'
            done
            if [ "$found" = 0 ] && [ -f build.log ]; then
              echo '```'
              tail -n 40 build.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          for log in build.log test.log; do
            [ -f "$log" ] || continue
            grep -E "^e: " "$log" | head -5 | while IFS= read -r line; do echo "::error::$line"; done || true
          done

      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk chistka.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest chistka.apk \
            --title "Чистка, сборка ${{ github.run_number }}" \
            --notes "Скачай chistka.apk и установи на телефон." \
            --latest
